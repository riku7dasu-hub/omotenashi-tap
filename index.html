<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>おもてなしタップ</title>
<style>
  :root {
    --main: #1f6d87;
    --accent: #d98a5e;
    --bg: #faf7f2;
    --card: #ffffff;
    --text: #2b2820;
    --danger: #d9453b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--main);
    color: white;
    padding: 22px 16px;
    text-align: center;
    border-radius: 0 0 22px 22px;
  }
  header h1 { margin: 0; font-size: 26px; }
  header p { margin: 8px 0 0; font-size: 16px; opacity: 0.9; }

  .lang-bar {
    display: flex;
    gap: 8px;
    justify-content: center;
    padding: 12px 10px;
    background: white;
    border-bottom: 1px solid #ddd;
  }
  .lang-btn {
    padding: 10px 20px;
    border-radius: 999px;
    border: 2px solid var(--main);
    background: white;
    color: var(--main);
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
  }
  .lang-btn.active { background: var(--main); color: white; }

  .screen { padding: 20px 16px 40px; max-width: 680px; margin: 0 auto; }

  .question {
    font-size: 26px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .opt-btn {
    padding: 30px 14px;
    background: var(--card);
    border: 2px solid #eeeae2;
    border-radius: 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    font-size: 21px;
    font-weight: bold;
    color: var(--text);
    cursor: pointer;
    text-align: center;
  }
  .opt-btn .icon { font-size: 44px; display: block; margin-bottom: 10px; }
  .opt-btn.emergency { border-color: var(--danger); color: var(--danger); }
  .opt-btn.wide { grid-column: span 2; }

  .stepper {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin: 30px 0;
  }
  .stepper button {
    width: 76px; height: 76px;
    font-size: 36px;
    border-radius: 50%;
    border: none;
    background: var(--main);
    color: white;
    cursor: pointer;
  }
  .stepper .val { font-size: 47px; font-weight: bold; min-width: 50px; text-align: center; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 260px;
    margin: 0 auto 20px;
  }
  .keypad button {
    padding: 20px 0;
    font-size: 29px;
    border-radius: 14px;
    border: 1px solid #eee;
    background: white;
    cursor: pointer;
  }
  .room-display {
    text-align: center;
    font-size: 42px;
    font-weight: bold;
    letter-spacing: 4px;
    margin-bottom: 16px;
    min-height: 40px;
    color: var(--main);
  }

  .primary-btn {
    display: block;
    width: 100%;
    padding: 17px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 3px 10px rgba(217,138,94,0.25);
  }
  .secondary-btn {
    display: block;
    width: 100%;
    padding: 15px;
    background: white;
    color: var(--main);
    border: 2px solid var(--main);
    border-radius: 16px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
  }
  .back-btn {
    display: block;
    margin: 20px auto 0;
    background: none;
    border: none;
    color: #888;
    font-size: 18px;
    cursor: pointer;
    text-decoration: underline;
  }

  .summary-box {
    background: var(--card);
    color: var(--text);
    border: 3px solid var(--main);
    border-radius: 22px;
    padding: 30px 22px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 14px rgba(31,109,135,0.12);
  }
  .summary-box .to-staff {
    font-size: 22px;
    font-weight: bold;
    color: var(--main);
    margin-bottom: 16px;
  }
  .room-badge {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 36px;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 10px 28px;
    border-radius: 14px;
    margin-bottom: 18px;
  }
  .room-badge .room-badge-label {
    display: block;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 0;
    opacity: 0.9;
    margin-bottom: 2px;
  }
  .summary-box .divider {
    height: 1px;
    background: #e5e0d5;
    margin: 0 0 16px;
  }
  .summary-box .jp-title {
    font-size: 29px;
    font-weight: bold;
    color: var(--text);
    margin-bottom: 12px;
  }
  .summary-box .jp-details {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .summary-box .jp-line {
    font-size: 25px;
    font-weight: bold;
    color: var(--text);
    background: #f4f0e6;
    border: 1px solid #e5e0d5;
    border-radius: 10px;
    padding: 9px 14px;
  }
  .urgent-tag {
    display: inline-block;
    background: var(--danger);
    color: white;
    font-size: 17px;
    padding: 4px 12px;
    border-radius: 999px;
    margin-top: 10px;
  }

  .address-note {
    background: #fdf3ea;
    border: 2px solid var(--accent);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: var(--text);
    line-height: 1.5;
    margin-top: 6px;
  }

  .explain-box {
    background: var(--card);
    border: 2px solid var(--main);
    border-radius: 20px;
    padding: 28px 22px;
    text-align: center;
    margin-bottom: 20px;
    font-size: 23px;
    line-height: 1.6;
  }
  .placeholder-tag {
    display: inline-block;
    background: #eee;
    color: #999;
    font-size: 14px;
    padding: 3px 10px;
    border-radius: 999px;
    margin-top: 12px;
  }
</style>
</head>
<body>

<header>
  <h1>おもてなしタップ</h1>
  <p>ゲストが選ぶだけで、スタッフには日本語で伝わります</p>
</header>

<div class="lang-bar" id="langBar"></div>
<div class="screen" id="screen"></div>

<script>

// ---- スプレッドシート連携（任意機能）----
// 導入するホテルごとに一意なIDをここに設定する（Apps Script側の対応表のキーと一致させる）
const HOTEL_ID = "toyama-sample";
// Apps ScriptをWebアプリとしてデプロイして発行されたURLをここに貼り付ける。
// 空のままなら送信処理はスキップされ、今まで通りlocalStorageのみで動作する（後方互換）。
const ANALYTICS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbw_qr1blXphGN6oY112-h9BE5dPaLuh34_rBaVRjIf_nKlcD-xcVqvNXILcjomDS64j/exec";

function genSessionId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// 投げっぱなしでスプレッドシートへイベント送信する。通信失敗・URL未設定でもアプリ本体は止めない。
function sendAnalyticsEvent(eventType, payload) {
  if (!ANALYTICS_WEBHOOK_URL) return;
  try {
    const body = JSON.stringify(Object.assign({ hotelId: HOTEL_ID, eventType, time: Date.now() }, payload));
    fetch(ANALYTICS_WEBHOOK_URL, {
      method: "POST",
      mode: "no-cors", // Apps ScriptのWebアプリ制約上、no-cors+text/plainが一番安定する
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body
    }).catch(() => {});
  } catch (e) { /* 通信できない環境でもアプリ本体は継続 */ }
}

// カテゴリごとに「何を選んだか」を短いコードで表す（スプレッドシート上で集計しやすくするため）
function analyticsKind(cat) {
  const a = state.answers;
  if (cat.id === "stay") return a.kind || "";
  if (cat.id === "trouble") return a.issue || "";
  if (cat.id === "taxi") return a.when || "";
  if (cat.id === "luggage") return a.destArea || "";
  if (cat.id === "emergency") return [a.issue, a.needsHospital, a.needsBandaid].filter(Boolean).join("/");
  return "";
}

const languages = [
  { code: "en", label: "English" },
  { code: "zh", label: "中文(繁體)" },
  { code: "ko", label: "한국어" },
];

// ---- fixed multilingual explanation texts ----
const airconExplain = {

  ko: "죄송합니다. 저희 호텔은 중앙 냉난방 시스템을 사용하여 객실별로 온도를 조절할 수 없습니다. 대신 선풍기나 여분의 담요를 빌려드릴 수 있습니다."
};

  ko: "네, 매일 조식에 할랄 친화적인 메뉴가 준비되어 있습니다 (표시된 메뉴를 확인해 주세요). 다른 식품 알레르기가 있으시면 식당에서 직원에게 알려주세요."

// 例：観光ルートの時刻表や周辺施設の案内など、施設ごとの固定情報をここに設定します
const localInfoExplain = {

  zh: "（範例）路線時刻表及周邊資訊依季節而異，請向工作人員確認今日詳情。",

// 締め出し（鍵を部屋に置いたまま外出）は選択肢を出さず、必ずスタッフが部屋まで同伴して解錠する前提の定型文にしている

  zh: "工作人員將為您安排前往醫院的交通，並盡快前來協助您。請稍候，我們馬上到。",

  { v: "ok", jp: "対応いたします", icon: "✅",
    text: { en: "We'll take care of that.", zh: "我們會為您處理。", ko: "처리해 드리겠습니다." } },

  { v: "no", jp: "対応が難しいです、申し訳ございません", icon: "🙏",

// NOTE: 施設ごとの実際の部屋タイプ名・コードに置き換えて運用してください（導入時にカスタマイズする項目です）
// 主要ハブ空港＋東北・中国地方を加えた8ブロック。ゲストは地名を読めなくても位置で選べる。

  return {
    en: `The extra charge for late checkout is ¥${yen.toLocaleString()}.`,

// kind: "extend"（延泊料金） / "roomchange"（部屋タイプ変更の料金） — 何の金額かを明示するため文言を分ける
// 延泊・部屋タイプ変更は満室で対応できないケースがあるため、料金入力の前に「ご用意できるか」を確認する
function roomUnavailableText(kind) {
  const subject = kind === "extend"
    ? { en: "an extra night", zh: "加住一晚的空房", ko: "연박 가능한 객실" }
    : { en: "the room type you requested", zh: "您想更改的房型", ko: "요청하신 객실 타입" };

const LUGGAGE_PICKUP_CUTOFF_HOUR = 18;
const luggageFarRegions = ["chitose", "fukuoka", "naha"];
function luggageMinDays(destAreaVal) {
  return luggageFarRegions.includes(destAreaVal) ? 2 : 1;
}
function addDaysMMDD(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return { mm, dd, str: mm + dd };
}
function luggageEarliestDate(destAreaVal) {
  const minDays = luggageMinDays(destAreaVal);
  const pastCutoff = new Date().getHours() >= LUGGAGE_PICKUP_CUTOFF_HOUR;
  const totalDays = minDays + (pastCutoff ? 1 : 0);
  return Object.assign({ pastCutoff, totalDays }, addDaysMMDD(totalDays));
}
function relativeDayLabelJp(days) {
  if (days === 1) return "明日";
  if (days === 2) return "明後日";
  return `${days}日後`;
}
function relativeDayLabel(days) {
  if (days === 1) return { en: "tomorrow", zh: "明天", ko: "내일" };

}

function lendAnswerText(availableItems, unavailableItems) {
  const sep = { en: ", ", zh: "、", ko: ", " };
  const texts = {};
  ["en", "zh", "ko"].forEach(lang => {
    const parts = [];
    if (availableItems.length) {
      const list = availableItems.map(o => o.label[lang]).join(sep[lang]);
      if (lang === "en") parts.push(`We can prepare: ${list}.`);
      if (lang === "zh") parts.push(`我們可以為您準備：${list}。`);
      if (lang === "ko") parts.push(`준비해 드리겠습니다: ${list}.`);
    }
    if (unavailableItems.length) {
      const list = unavailableItems.map(o => o.label[lang]).join(sep[lang]);
      const plural = unavailableItems.length > 1;
      if (lang === "en") parts.push(`Sorry, ${list} ${plural ? "are" : "is"} currently being used by another guest. Please check with us again later — ${plural ? "they" : "it"} may become available once returned.`);
      if (lang === "zh") parts.push(`很抱歉，${list} 目前有其他房客正在使用。請稍後再次詢問我們，歸還後或許就能為您提供。`);
      if (lang === "ko") parts.push(`죄송합니다, ${list}은(는) 현재 다른 투숙객이 사용 중입니다. 반납되면 다시 대여해 드릴 수 있으니 잠시 후 다시 문의해 주세요.`);
    }
    texts[lang] = parts.join("\n");
  });
  return texts;
}

    steps: [

        options: [
          { v: "yes", jp: "はい、病院へ", icon:"🚑", label:{ en:"Yes, please", zh:"是，需要", ko:"네, 부탁드려요" } },
          { v: "no", jp: "いいえ、大丈夫です", icon:"🙅", label:{ en:"No, that's okay", zh:"不用了", ko:"아니요, 괜찮아요" } }
        ]
      },
      { type: "choice", key: "needsBandaid",
        q: { en: "Would you like a band-aid?", zh: "需要OK繃嗎？", ko: "밴드(반창고)가 필요하신가요?" },
        options: [
          { v: "yes", jp: "はい、お願いします", icon:"🩹", label:{ en:"Yes, please", zh:"是，需要", ko:"네, 부탁드려요" } },
          { v: "no", jp: "いいえ、大丈夫です", icon:"🙅", label:{ en:"No, that's okay", zh:"不用了", ko:"아니요, 괜찮아요" } }
        ]
      },
      { type: "room", key: "room" }
    ],
    summary: (a, opt) => {
      const lines = ["🚨 体調不良・お怪我のご相談", opt.jp];
      if (a.needsHospital === "yes") lines.push("病院の手配を希望");
      else if (a.needsBandaid === "yes") lines.push("絆創膏をご希望");
      else if (a.needsHospital === "no") lines.push("病院・絆創膏いずれも不要とのこと");
      lines.push("至急");
      return lines;
    }
  }
];

let state = { screen: "home", lang: null, catId: null, stepIndex: 0, answers: {}, selectedOpt: {}, explain: null, historyLogged: false };

function t(obj) { return obj[state.lang] || obj.en; }

// ---- リクエスト履歴（この端末のブラウザ内にのみ保存。サーバーなし、簡易ログ用） ----
const HISTORY_KEY = "hrb_history_v1";
const HISTORY_MAX = 1000; // 古いものから自動で切り捨てる

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return []; // localStorageが使えない環境でもアプリ本体は動作継続させる
  }
}
function saveHistoryEntry(entry) {
  try {
    const list = loadHistory();
    list.unshift(entry);
    if (list.length > HISTORY_MAX) list.length = HISTORY_MAX;
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  } catch (e) { /* 保存できなくてもアプリは継続 */ }
}
function clearHistory() {
  try { localStorage.removeItem(HISTORY_KEY); } catch (e) {}
}
function exportHistoryCsv(list) {
  const csvEscape = (s) => `"${String(s == null ? "" : s).replace(/"/g, '""')}"`;
  const header = ["日時", "カテゴリ", "詳細", "部屋番号", "至急", "回答(英語)"].map(csvEscape).join(",");
  const rows = list.map(e => {
    const d = new Date(e.time);
    const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
    const detail = (e.lines || []).slice(1).join(" / ");
    return [dateStr, (e.lines && e.lines[0]) || "", detail, e.room || "", e.urgent ? "至急" : "", e.answerEn || ""].map(csvEscape).join(",");
  });
  const csv = "\uFEFF" + [header, ...rows].join("\r\n"); // BOM付きでExcelでも文字化けしないようにする
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const now = new Date();
  a.download = `request_history_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderLangBar() {
  const bar = document.getElementById("langBar");
  bar.innerHTML = "";
  languages.forEach(l => {
    const btn = document.createElement("button");
    btn.className = "lang-btn" + (state.lang === l.code ? " active" : "");
    btn.textContent = l.label;
    btn.onclick = () => { state.lang = l.code; state.screen = "home"; render(); };
    bar.appendChild(btn);
  });
}

function goHome() {
  state.screen = "home"; state.catId = null; state.stepIndex = 0; state.answers = {}; state.selectedOpt = {}; state.explain = null;
  state.peopleStep = false; state.staffAmount = undefined; state.lendUnavailable = {}; state.customDateMode = false; state.pendingCancelYen = undefined;
  state.taxiEtaMinutes = undefined; state.pendingTaxiMinutes = undefined; state.taxiGuestAccepted = undefined;
  state.historyLogged = false; state.lastAmountYen = undefined; state.lastUnavailableItems = undefined;
  render();
}

function startCategory(cat) {
  // 離脱率分析用：カテゴリを開いた時点で毎回「開始」イベントを送る（完了イベントと同じsessionIdで後から突き合わせる）
  state.sessionId = genSessionId();
  state.flowStartTime = Date.now();
  sendAnalyticsEvent("start", { category: cat.id, sessionId: state.sessionId });

  if (cat.staticInfo) {
    state.screen = "explain";
    state.explain = { text: cat.content, placeholder: cat.placeholder, action: null, backTo: "home" };
    render();
    return;
  }
  if (cat.faq) {
    state.screen = "faqlist";
    state.catId = cat.id;
    render();
    return;
  }
  state.screen = "flow"; state.catId = cat.id; state.stepIndex = 0; state.answers = {}; state.selectedOpt = {};
  state.peopleStep = false; state.staffAmount = undefined; state.lendUnavailable = {}; state.customDateMode = false; state.pendingCancelYen = undefined;
  state.taxiEtaMinutes = undefined; state.pendingTaxiMinutes = undefined; state.taxiGuestAccepted = undefined;
  state.historyLogged = false; state.lastAmountYen = undefined; state.lastUnavailableItems = undefined;
  render();
}

function currentCategory() { return categories.find(c => c.id === state.catId); }

// "stay" builds its step list dynamically based on which "kind" the guest picked
function getSteps(cat) {
  if (cat.id === "taxi") {
    const base = [cat.steps[0]];
    if (state.answers.when === "time") {
      base.push({ type: "date", key: "date",
        q: { en: "What date would you like the taxi? (MM/DD)", zh: "您希望哪一天用車？（月/日）", ko: "몇 월 며칠에 필요하신가요? (월/일)" } });
      base.push({ type: "time", key: "time",
        q: { en: "What time would you like the taxi?", zh: "您希望幾點搭乘計程車？", ko: "몇 시에 택시를 이용하시겠어요?" } });
    }
    base.push(cat.steps[1], cat.steps[2]);
    return base;
  }
  // 締め出しは本質的に緊急なので「緊急ですか？」を聞かずスキップする（choiceステップのonclickでurgent=trueを自動セット）
  if (cat.id === "trouble") {
    const base = [cat.steps[0]];
    if (state.answers.issue !== "lockedout") base.push(cat.steps[1]);
    base.push(cat.steps[2]);
    return base;
  }
  // 緊急対応：病院手配が必要な場合は絆創膏の質問をスキップする
  if (cat.id === "emergency") {
    const base = [cat.steps[0], cat.steps[1]];
    if (state.answers.needsHospital === "no") base.push(cat.steps[2]);
    base.push(cat.steps[3]);
    return base;
  }
  if (cat.id !== "stay") return cat.steps;
  const base = [cat.steps[0]];
  const kind = state.answers.kind;
  if (kind === "late") {
    base.push({ type: "stepper", key: "amount",
      q: { en: "How many extra hours would you like for late checkout?", zh: "您希望延遲退房幾個小時？", ko: "레이트 체크아웃을 몇 시간 원하시나요?" } });
    base.push({ type: "room", key: "room" });
  } else if (kind === "extend") {
    base.push({ type: "stepper", key: "amount",
      q: { en: "How many additional nights would you like to stay?", zh: "您想延長住宿幾晚？", ko: "몇 박 더 연장하시겠어요?" } });
    base.push({ type: "peopleChange", key: "peopleMode" });
    base.push({ type: "room", key: "room" });
  } else if (kind === "cancel") {
    base.push({ type: "stepper", key: "amount",
      q: { en: "How many nights would you like to cancel or reduce?", zh: "您想取消或減少幾晚？", ko: "몇 박을 취소하거나 줄이시겠어요?" } });
    base.push({ type: "room", key: "room" });
  } else if (kind === "roomchange") {
    base.push({ type: "choice", key: "roomType",
      q: { en: "Which room type?", zh: "您想更改為哪種房型？", ko: "어떤 객실 타입으로 변경하시겠어요?" },
      options: roomTypeOptions });
    base.push({ type: "room", key: "room" });
  } else {
    base.push({ type: "room", key: "room" });
  }
  return base;
}

function nextStep() {
  const cat = currentCategory();
  const steps = getSteps(cat);
  const idx = state.stepIndex + 1;
  if (idx < steps.length) {
    state.stepIndex = idx;
  } else {
    state.screen = "summary";
  }
  render();
}

function prevStep() {
  state.customDateMode = false;
  state.peopleStep = false;
  const idx = state.stepIndex - 1;
  if (idx >= 0) {
    state.stepIndex = idx;
    render();
  } else {
    goHome();
  }
}

function showExplain(text, action, placeholder, backTo) {
  state.screen = "explain";
  state.explain = { text, action, placeholder, backTo: backTo || "home" };
  render();
}

function render() {
  const screen = document.getElementById("screen");
  screen.innerHTML = "";

  if (!state.lang) {
    document.getElementById("langBar").style.display = "none";
    const q = document.createElement("div");
    q.className = "question";
    q.textContent = T.chooseLang.en + " / " + T.chooseLang.zh + " / " + T.chooseLang.ko;
    screen.appendChild(q);
    const grid = document.createElement("div");
    grid.className = "grid";
    languages.forEach(l => {
      const b = document.createElement("button");
      b.className = "opt-btn wide";
      b.textContent = l.label;
      b.onclick = () => { state.lang = l.code; render(); };
      grid.appendChild(b);
    });
    screen.appendChild(grid);
    return;
  }

  document.getElementById("langBar").style.display = "flex";
  renderLangBar();

  if (state.screen === "home") {
    const q = document.createElement("div");
    q.className = "question";
    q.textContent = t(T.homeQuestion);
    screen.appendChild(q);

    const grid = document.createElement("div");
    grid.className = "grid";
    categories.forEach(cat => {
      const b = document.createElement("button");
      b.className = "opt-btn" + (cat.emergency ? " emergency" : "");
      b.innerHTML = `<span class="icon">${cat.icon}</span>${t(cat.label)}`;
      b.onclick = () => startCategory(cat);
      grid.appendChild(b);
    });
    screen.appendChild(grid);

    const histLink = document.createElement("button");
    histLink.className = "back-btn";
    histLink.style.marginTop = "24px";
    histLink.textContent = "📋 リクエスト履歴（スタッフ用）";
    histLink.onclick = () => { state.screen = "history"; render(); };
    screen.appendChild(histLink);
    return;
  }

  if (state.screen === "faqlist") {
    const cat = currentCategory();
    const q = document.createElement("div");
    q.className = "question";
    q.textContent = t(cat.label);
    screen.appendChild(q);

    const grid = document.createElement("div");
    grid.className = "grid";
    cat.questions.forEach(item => {
      const b = document.createElement("button");
      b.className = "opt-btn wide";
      b.innerHTML = `<span class="icon">${item.icon}</span>${t(item.label)}`;
      b.onclick = () => showExplain(item.answer, null, item.placeholder, "faqlist");
      grid.appendChild(b);
    });
    screen.appendChild(grid);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← " + t(T.backHome);
    back.onclick = goHome;
    screen.appendChild(back);
    return;
  }

  if (state.screen === "explain") {
    const box = document.createElement("div");
    box.className = "explain-box";
    box.textContent = t(state.explain.text);
    if (state.explain.placeholder) {
      const tag = document.createElement("div");
      tag.className = "placeholder-tag";
      tag.textContent = "PLACEHOLDER - 実際の運用内容に差し替えてください";
      box.appendChild(document.createElement("br"));
      box.appendChild(tag);
    }
    screen.appendChild(box);

    if (state.explain.action) {
      const actBtn = document.createElement("button");
      actBtn.className = "primary-btn";
      actBtn.textContent = t(state.explain.action.label);
      actBtn.onclick = state.explain.action.onClick;
      screen.appendChild(actBtn);
    }

    const closeBtn = document.createElement("button");
    closeBtn.className = "secondary-btn";
    closeBtn.textContent = t(T.close);
    closeBtn.onclick = goHome;
    screen.appendChild(closeBtn);

    const backTo = state.explain.backTo || "home";
    const backEl = document.createElement("button");
    backEl.className = "back-btn";
    backEl.textContent = "← " + t(T.backStep);
    backEl.onclick = () => {
      if (backTo === "flow") { state.screen = "flow"; render(); }
      else if (backTo === "faqlist") { state.screen = "faqlist"; render(); }
      else { goHome(); }
    };
    screen.appendChild(backEl);
    return;
  }

  if (state.screen === "flow") {
    const cat = currentCategory();
    const steps = getSteps(cat);
    const step = steps[state.stepIndex];

    if (step.type === "choice") {
      const q = document.createElement("div");
      q.className = "question";
      q.textContent = t(step.q);
      screen.appendChild(q);

      const grid = document.createElement("div");
      grid.className = "grid";
      step.options.forEach(opt => {
        const b = document.createElement("button");
        b.className = "opt-btn";
        b.innerHTML = `<span class="icon">${opt.icon}</span>${t(opt.label)}`;
        b.onclick = () => {
          state.answers[step.key] = opt.v;
          state.selectedOpt[step.key] = opt;

          // special case: aircon issue -> explain screen with link to borrowing a fan/blanket
          if (cat.id === "trouble" && opt.v === "aircon") {
            showExplain(airconExplain, {
              label: borrowFanLabel,
              onClick: () => { startCategory(categories.find(c => c.id === "lend")); }
            }, false, "flow");
            return;
          }

          // 締め出しは「緊急ですか？」の質問をスキップするので、代わりに自動でurgent扱いにする
          if (cat.id === "trouble" && opt.v === "lockedout") {
            state.answers.urgent = true;
          }

          // 荷物輸送：「まだ決めていない」なら住所や個数を聞かず、スタッフ確認なしでそのまま案内を出す
          if (cat.id === "luggage" && opt.v === "notyet") {
            state.screen = "guestAnswer";
            state.answer = { text: luggageLaterText };
            render();
            return;
          }

          nextStep();
        };
        grid.appendChild(b);
      });
      screen.appendChild(grid);
    }

    else if (step.type === "multiItem") {
      const q = document.createElement("div");
      q.className = "question";
      q.textContent = t(step.q);
      screen.appendChild(q);

      if (!state.answers[step.key]) {
        state.answers[step.key] = {};
        step.options.forEach(o => { state.answers[step.key][o.v] = 0; });
      }
      const counts = state.answers[step.key];

      const list = document.createElement("div");
      list.style.display = "flex";
      list.style.flexDirection = "column";
      list.style.gap = "10px";

      step.options.forEach(opt => {
        const row = document.createElement("div");
        row.style.display = "flex";
        row.style.alignItems = "center";
        row.style.justifyContent = "space-between";
        row.style.background = "var(--card)";
        row.style.borderRadius = "16px";
        row.style.padding = "13px 15px";
        row.style.boxShadow = "0 3px 10px rgba(0,0,0,0.05)";

        const label = document.createElement("div");
        label.style.fontSize = "15px";
        label.style.fontWeight = "bold";
        label.innerHTML = `<span style="font-size: 29px;margin-right:8px;">${opt.icon}</span>${t(opt.label)}`;
        row.appendChild(label);

        const stepWrap = document.createElement("div");
        stepWrap.style.display = "flex";
        stepWrap.style.alignItems = "center";
        stepWrap.style.gap = "8px";
        stepWrap.style.flexShrink = "0";

        const minus = document.createElement("button");
        minus.textContent = "−";
        Object.assign(minus.style, { width:"44px", height:"44px", borderRadius:"50%", border:"none", background:"var(--main)", color:"white", fontSize:"23px", cursor:"pointer" });
        minus.onclick = () => { counts[opt.v] = Math.max(0, counts[opt.v]-1); render(); };

        const val = document.createElement("div");
        val.style.minWidth = "20px";
        val.style.textAlign = "center";
        val.style.fontSize = "17px";
        val.style.fontWeight = "bold";
        val.textContent = counts[opt.v];

        const plus = document.createElement("button");
        plus.textContent = "＋";
        Object.assign(plus.style, { width:"44px", height:"44px", borderRadius:"50%", border:"none", background:"var(--main)", color:"white", fontSize:"23px", cursor:"pointer" });
        plus.onclick = () => { counts[opt.v] = counts[opt.v]+1; render(); };

        stepWrap.appendChild(minus); stepWrap.appendChild(val); stepWrap.appendChild(plus);
        row.appendChild(stepWrap);
        list.appendChild(row);
      });
      screen.appendChild(list);

      const total = Object.values(counts).reduce((a,b) => a+b, 0);
      const btn = document.createElement("button");
      btn.className = "primary-btn";
      btn.textContent = t(T.confirm) + (total > 0 ? ` (${total})` : "");
      btn.style.opacity = total === 0 ? "0.4" : "1";
      btn.onclick = () => { if (total > 0) nextStep(); };
      screen.appendChild(btn);
    }

    else if (step.type === "stepper") {
      const q = document.createElement("div");
      q.className = "question";
      q.textContent = t(step.q || T.howMany);
      screen.appendChild(q);

      if (!state.answers[step.key]) state.answers[step.key] = 1;
      const wrap = document.createElement("div");
      wrap.className = "stepper";
      const minus = document.createElement("button");
      minus.textContent = "−";
      minus.onclick = () => { state.answers[step.key] = Math.max(1, state.answers[step.key]-1); render(); };
      const val = document.createElement("div");
      val.className = "val";
      val.textContent = state.answers[step.key];
      const plus = document.createElement("button");
      plus.textContent = "＋";
      plus.onclick = () => { state.answers[step.key] = state.answers[step.key]+1; render(); };
      wrap.appendChild(minus); wrap.appendChild(val); wrap.appendChild(plus);
      screen.appendChild(wrap);

      const btn = document.createElement("button");
      btn.className = "primary-btn";
      btn.textContent = t(T.confirm);
      btn.onclick = nextStep;
      screen.appendChild(btn);
    }

    else if (step.type === "peopleChange") {
      const q = document.createElement("div");
      q.className = "question";
      q.textContent = t(T.peopleQuestion);
      screen.appendChild(q);

      const grid = document.createElement("div");
      grid.className = "grid";

      const sameBtn = document.createElement("button");
      sameBtn.className = "opt-btn wide" + (state.answers.peopleMode === "same" ? "" : "");
      sameBtn.textContent = t(T.same);
      sameBtn.onclick = () => { state.answers.peopleMode = "same"; state.peopleStep = false; nextStep(); };
      grid.appendChild(sameBtn);

      const moreBtn = document.createElement("button");
      moreBtn.className = "opt-btn";
      moreBtn.textContent = t(T.more);
      moreBtn.onclick = () => { state.answers.peopleMode = "more"; state.peopleStep = true; render(); };
      grid.appendChild(moreBtn);

      const fewerBtn = document.createElement("button");
      fewerBtn.className = "opt-btn";
      fewerBtn.textContent = t(T.fewer);
      fewerBtn.onclick = () => { state.answers.peopleMode = "fewer"; state.peopleStep = true; render(); };
      grid.appendChild(fewerBtn);

      screen.appendChild(grid);

      if (state.peopleStep) {
        if (!state.answers.peopleCount) state.answers.peopleCount = 1;
        const q2 = document.createElement("div");
        q2.className = "question";
        q2.style.fontSize = "16px";
        q2.style.marginTop = "24px";
        q2.textContent = t(T.howManyPeople);
        screen.appendChild(q2);

        const wrap = document.createElement("div");
        wrap.className = "stepper";
        const minus = document.createElement("button");
        minus.textContent = "−";
        minus.onclick = () => { state.answers.peopleCount = Math.max(1, state.answers.peopleCount-1); render(); };
        const val = document.createElement("div");
        val.className = "val";

    else if (step.type === "urgency") {

      const notBtn = document.createElement("button");
      notBtn.className = "opt-btn";

      notBtn.onclick = () => { state.answers[step.key] = false; nextStep(); };
      grid.appendChild(urgentBtn); grid.appendChild(notBtn);
      screen.appendChild(grid);
    }

    else if (step.type === "mapArea") {
      const q = document.createElement("div");
      q.className = "question";
      q.textContent = t(step.q);
      screen.appendChild(q);

      const hint = document.createElement("div");
      hint.className = "address-note";
      hint.textContent = t({
        en: "Not sure? Just tap the closest big city — an approximate area is fine, we'll confirm the exact address with you separately.",
        zh: "不確定也沒關係，請點選最近的大城市即可，大概的地區就可以，正確地址我們會再與您確認。",
        ko: "정확히 모르셔도 괜찮습니다. 가장 가까운 대도시를 선택해 주세요. 대략적인 지역이면 충분하며, 정확한 주소는 따로 확인하겠습니다."
      });
      screen.appendChild(hint);

      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 300 660");
      svg.style.width = "100%";
      svg.style.maxWidth = "340px";
      svg.style.display = "block";
      svg.style.margin = "0 auto 16px";

      const pick = (r) => { state.answers[step.key] = r.v; state.selectedOpt[step.key] = r; nextStep(); };

      // フォントサイズはボックス幅に対して自動で縮小し、ラベルがはみ出さないようにする
      const fitFontSize = (text, boxWidth, baseSize) => {
        const avgCharW = 0.62; // 太字サンセリフの概算文字幅
        const maxTextWidth = boxWidth - 16; // 左右余白
        const estWidth = text.length * baseSize * avgCharW;
        if (estWidth <= maxTextWidth) return baseSize;
        return Math.max(9, Math.floor(maxTextWidth / (text.length * avgCharW)));
      };

      mapRegions.forEach(r => {
        const rect = document.createElementNS(svgNS, "rect");
        rect.setAttribute("x", r.x);
        rect.setAttribute("y", r.y);
        rect.setAttribute("width", r.w);
        rect.setAttribute("height", r.h);
        rect.setAttribute("rx", 14);
        rect.setAttribute("fill", "var(--main)");
        rect.setAttribute("fill-opacity", "0.9");
        rect.setAttribute("stroke", "white");
        rect.setAttribute("stroke-width", "2.5");
        rect.style.cursor = "pointer";
        rect.onclick = () => pick(r);
        svg.appendChild(rect);

        const lines = r.map.split("\n");
        const label = document.createElementNS(svgNS, "text");
        label.setAttribute("x", r.x + r.w/2);
        label.setAttribute("text-anchor", "middle");
        label.setAttribute("fill", "white");
        label.setAttribute("font-weight", "bold");
        label.style.pointerEvents = "none";
        const midY = r.y + r.h/2;
        const fontSizes = lines.map((line, i) => fitFontSize(line, r.w, i === 0 ? 18 : 13));
        const lineHeight = Math.max(...fontSizes) + 6;
        const startY = midY - ((lines.length - 1) * lineHeight) / 2 + Math.max(...fontSizes) * 0.32;
        lines.forEach((line, i) => {
          const tspan = document.createElementNS(svgNS, "tspan");
          tspan.setAttribute("x", r.x + r.w/2);
          tspan.setAttribute("y", startY + i * lineHeight);
          tspan.setAttribute("font-size", fontSizes[i]);
          tspan.textContent = line;
          label.appendChild(tspan);
        });
        svg.appendChild(label);
      });
      screen.appendChild(svg);

    else if (step.type === "arrivalChoice") {

      disp.textContent = raw.length >= 3 ? raw.slice(0,2) + "/" + raw.slice(2) : (raw ? raw + "/--" : "--/--");
      screen.appendChild(disp);

      const pad = document.createElement("div");
      pad.className = "keypad";
      ["1","2","3","4","5","6","7","8","9","←","0","OK"].forEach(k => {
        const b = document.createElement("button");

    else if (step.type === "time") {

      const pad = document.createElement("div");

      ["1","2","3","4","5","6","7","8","9","←","0","OK"].forEach(k => {
        const b = document.createElement("button");
        b.textContent = k;
        b.onclick = () => {

    const back = document.createElement("button");

  if (state.screen === "summary") {
    const cat = currentCategory();

      if (cat.id === "stay" && state.answers.kind === "late") { state.screen = "staffAutoCalc"; render(); return; }
      if (cat.id === "stay" && ["extend","roomchange"].includes(state.answers.kind)) { state.screen = "staffAvailability"; render(); return; }
      if (cat.id === "stay" && state.answers.kind === "cancel") { state.screen = "staffNumeric"; render(); return; }
      if (cat.id === "luggage") { state.screen = "staffLuggageIntake"; render(); return; }
      if (cat.id === "taxi") { state.screen = "staffTaxiWait"; render(); return; }
      if (cat.id === "trouble" && state.answers.issue === "lockedout") { state.screen = "staffLockedOut"; render(); return; }
      if (cat.id === "emergency" && state.answers.needsHospital === "yes") { state.screen = "staffEmergencyHospital"; render(); return; }
      if (cat.id === "emergency" && state.answers.needsHospital === "no" && state.answers.needsBandaid === "yes") { state.screen = "staffEmergencyBandaid"; render(); return; }
      if (cat.id === "emergency" && state.answers.needsHospital === "no" && state.answers.needsBandaid === "no") { state.screen = "staffEmergencyNone"; render(); return; }
      state.screen = "staffAnswer"; render();
    };
    screen.appendChild(answerBtn);

    const back = document.createElement("button");

    q.textContent = "スタッフ用：レイトチェックアウト料金（自動計算）";
    screen.appendChild(q);

    const box = document.createElement("div");
    box.className = "explain-box";
    box.innerHTML = `延長 ${hours}時間 × 1,000円（例）<br><span style="font-size: 39px;">＝ ${yen.toLocaleString()}円</span>`;
    screen.appendChild(box);

    const rateNote = document.createElement("div");
    rateNote.className = "placeholder-tag";
    rateNote.style.display = "block";
    rateNote.style.textAlign = "center";
    rateNote.style.marginBottom = "16px";
    rateNote.textContent = "PLACEHOLDER - 単価は貴施設の規定に合わせて設定します";
    screen.appendChild(rateNote);

    const sendBtn = document.createElement("button");
    sendBtn.className = "primary-btn";
    sendBtn.textContent = "この金額でゲストに伝える";
    sendBtn.onclick = () => { state.lastAmountYen = yen; state.screen = "guestAnswer"; state.answer = { text: lateCheckoutAnswerText(yen) }; render(); };
    screen.appendChild(sendBtn);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← 戻る";
    back.onclick = () => { state.screen = "summary"; render(); };
    screen.appendChild(back);
    return;
  }

  if (state.screen === "staffAvailability") {
    const availCat = currentCategory();
    const kind = state.answers.kind;
    const q = document.createElement("div");
    q.className = "question";
    q.textContent = kind === "extend"
      ? "スタッフ用：延泊分のお部屋をご用意できますか？"
      : "スタッフ用：ご希望のお部屋タイプをご用意できますか？";
    screen.appendChild(q);

    const grid = document.createElement("div");
    grid.className = "grid";

    const yesBtn = document.createElement("button");
    yesBtn.className = "opt-btn wide";
    yesBtn.innerHTML = `<span class="icon">◯</span>ご用意できます（料金を入力）`;
    yesBtn.onclick = () => { state.screen = "staffNumeric"; render(); };
    grid.appendChild(yesBtn);

    const noBtn = document.createElement("button");
    noBtn.className = "opt-btn wide";
    noBtn.innerHTML = `<span class="icon">✕</span>満室・対応できません`;
    noBtn.onclick = () => {
      state.screen = "guestAnswer";
      state.answer = { text: roomUnavailableText(kind) };
      render();
    };
    grid.appendChild(noBtn);

    screen.appendChild(grid);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← 戻る";
    back.onclick = () => { state.screen = "summary"; render(); };
    screen.appendChild(back);
    return;
  }

  if (state.screen === "staffNumeric") {
    if (state.staffAmount === undefined) state.staffAmount = "";

    const numericCat = currentCategory();
    let amountLabel = "金額";
    if (numericCat.id === "luggage") amountLabel = "輸送費";
    else if (numericCat.id === "stay" && state.answers.kind === "cancel") amountLabel = "キャンセル料";
    else if (numericCat.id === "stay" && state.answers.kind === "extend") amountLabel = "延泊料金";
    else if (numericCat.id === "stay" && state.answers.kind === "roomchange") amountLabel = "部屋タイプ変更の料金";

    const q = document.createElement("div");
    q.className = "question";
    q.textContent = `スタッフ用：${amountLabel}を入力してください（円）`;
    screen.appendChild(q);

    const disp = document.createElement("div");
    disp.className = "room-display";
    disp.textContent = state.staffAmount ? Number(state.staffAmount).toLocaleString() + "円" : "----円";
    screen.appendChild(disp);

    const pad = document.createElement("div");
    pad.className = "keypad";
    ["1","2","3","4","5","6","7","8","9","←","0","OK"].forEach(k => {
      const b = document.createElement("button");
      b.textContent = k;
      b.onclick = () => {
        if (k === "←") state.staffAmount = state.staffAmount.slice(0,-1);
        else if (k === "OK") {
          const yen = Number(state.staffAmount || 0);
          const currentCat = currentCategory();
          state.staffAmount = undefined;
          state.lastAmountYen = yen;
          // キャンセル料が発生する場合は、事前カード決済か現地精算かでゲストへの案内文が変わるため一段階挟む
          if (currentCat.id === "stay" && state.answers.kind === "cancel" && yen > 0) {
            state.pendingCancelYen = yen;
            state.screen = "staffPaymentMethod";
            render();
            return;
          }
          const textFn = currentCat.id === "luggage" ? luggageFeeAnswerText
            : state.answers.kind === "cancel" ? cancelFeeAnswerText : feeAnswerText;
          state.screen = "guestAnswer";
          state.answer = { text: textFn(yen, state.answers.kind) };
          render();
          return;
        }
        else if (state.staffAmount.length < 6) state.staffAmount += k;
        render();
      };
      pad.appendChild(b);
    });
    screen.appendChild(pad);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← 戻る";
    back.onclick = () => {
      state.staffAmount = undefined;
      state.screen = ["extend","roomchange"].includes(state.answers.kind) ? "staffAvailability" : "summary";
      render();
    };
    screen.appendChild(back);
    return;
  }

  if (state.screen === "staffPaymentMethod") {
    const yen = state.pendingCancelYen || 0;

    const q = document.createElement("div");
    q.className = "question";
    q.textContent = "スタッフ用：返金方法を選択してください";
    screen.appendChild(q);

    const box = document.createElement("div");
    box.className = "explain-box";
    box.innerHTML = `キャンセル料 ${yen.toLocaleString()}円<br><span style="font-size: 18px;">を差し引いた残額の返金方法</span>`;
    screen.appendChild(box);

    const grid = document.createElement("div");
    grid.className = "grid";

    const cardBtn = document.createElement("button");
    cardBtn.className = "opt-btn wide";
    cardBtn.innerHTML = `<span class="icon">💳</span>事前カード決済（カードへ返金）`;
    cardBtn.onclick = () => {
      state.screen = "guestAnswer";
      state.answer = { text: cancelFeeAnswerText(yen, "card") };
      state.pendingCancelYen = undefined;
      render();
    };
    grid.appendChild(cardBtn);

    const onsiteBtn = document.createElement("button");
    onsiteBtn.className = "opt-btn wide";
    onsiteBtn.innerHTML = `<span class="icon">💴</span>現地精算（フロントで現金にてお返し）`;
    onsiteBtn.onclick = () => {
      state.screen = "guestAnswer";
      state.answer = { text: cancelFeeAnswerText(yen, "onsite") };
      state.pendingCancelYen = undefined;
      render();
    };
    grid.appendChild(onsiteBtn);

    screen.appendChild(grid);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← 戻る";
    back.onclick = () => { state.screen = "staffNumeric"; state.pendingCancelYen = undefined; render(); };
    screen.appendChild(back);
    return;
  }

  if (state.screen === "staffTaxiWait") {
    const q = document.createElement("div");
    q.className = "question";
    q.textContent = "スタッフ用：まずゲストに伝えてください";
    screen.appendChild(q);

    const box = document.createElement("div");
    box.className = "explain-box";
    box.textContent = "このあと業者へお電話でご確認ください。先にゲストへ一言伝えましょう。";
    screen.appendChild(box);

    const btn = document.createElement("button");
    btn.className = "primary-btn";
    btn.textContent = "「少々お待ちください」と伝える";
    btn.onclick = () => { state.screen = "guestTaxiWaitMsg"; render(); };
    screen.appendChild(btn);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← 戻る";
    back.onclick = () => { state.screen = "summary"; render(); };
    screen.appendChild(back);
    return;
  }

  if (state.screen === "guestTaxiWaitMsg") {
    const box = document.createElement("div");
    box.className = "explain-box";
    box.textContent = t(taxiWaitText);
    screen.appendChild(box);

    const btn = document.createElement("button");
    btn.className = "primary-btn";
    btn.textContent = t(T.close);
    btn.onclick = () => { state.screen = "staffTaxiEta"; render(); };
    screen.appendChild(btn);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← " + t(T.backStep);
    back.onclick = () => { state.screen = "staffTaxiWait"; render(); };
    screen.appendChild(back);
    return;
  }

  if (state.screen === "staffTaxiEta") {
    const q = document.createElement("div");
    q.className = "question";
    q.textContent = "スタッフ用：業者への確認結果を選んでください";
    screen.appendChild(q);

    const grid = document.createElement("div");
    grid.className = "grid";

    const noBtn = document.createElement("button");
    noBtn.className = "opt-btn wide";
    noBtn.innerHTML = `<span class="icon">🙏</span>今は手配できません`;
    noBtn.onclick = () => {
      state.screen = "guestAnswer";
      state.answer = { text: taxiUnavailableText };
      render();
    };
    grid.appendChild(noBtn);

    const yesBtn = document.createElement("button");
    yesBtn.className = "opt-btn wide";
    yesBtn.innerHTML = `<span class="icon">🚕</span>手配できます（到着まで分数を入力）`;
    yesBtn.onclick = () => { state.screen = "staffTaxiMinutes"; render(); };
    grid.appendChild(yesBtn);

    screen.appendChild(grid);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← 戻る";
    back.onclick = () => { state.screen = "staffTaxiWait"; render(); };
    screen.appendChild(back);
    return;
  }

  if (state.screen === "staffTaxiMinutes") {
    if (state.taxiEtaMinutes === undefined) state.taxiEtaMinutes = "";

    const q = document.createElement("div");
    q.className = "question";
    q.textContent = "スタッフ用：最短到着まで何分か入力してください";
    screen.appendChild(q);

    const disp = document.createElement("div");
    disp.className = "room-display";
    disp.textContent = state.taxiEtaMinutes ? `${state.taxiEtaMinutes}分後` : "--分後";
    screen.appendChild(disp);

    const pad = document.createElement("div");
    pad.className = "keypad";
    ["1","2","3","4","5","6","7","8","9","←","0","OK"].forEach(k => {
      const b = document.createElement("button");
      b.textContent = k;
      b.onclick = () => {
        if (k === "←") state.taxiEtaMinutes = state.taxiEtaMinutes.slice(0,-1);
        else if (k === "OK") {
          if (!state.taxiEtaMinutes) return;
          state.pendingTaxiMinutes = Number(state.taxiEtaMinutes);
          state.taxiEtaMinutes = undefined;
          state.screen = "guestTaxiConfirm";
          render();
          return;
        }
        else if (state.taxiEtaMinutes.length < 3) state.taxiEtaMinutes += k;
        render();
      };
      pad.appendChild(b);
    });
    screen.appendChild(pad);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← 戻る";
    back.onclick = () => { state.screen = "staffTaxiEta"; state.taxiEtaMinutes = undefined; render(); };
    screen.appendChild(back);
    return;
  }

  if (state.screen === "guestTaxiConfirm") {
    const min = state.pendingTaxiMinutes || 0;

    const box = document.createElement("div");
    box.className = "explain-box";
    box.textContent = t(taxiEtaConfirmText(min));
    screen.appendChild(box);

    const grid = document.createElement("div");
    grid.className = "grid";

    const yesBtn = document.createElement("button");
    yesBtn.className = "opt-btn wide";
    yesBtn.textContent = t(taxiYesLabel);
    yesBtn.onclick = () => { state.taxiGuestAccepted = true; state.screen = "staffTaxiResult"; render(); };
    grid.appendChild(yesBtn);

    const noBtn = document.createElement("button");
    noBtn.className = "opt-btn wide";
    noBtn.textContent = t(taxiNoLabel);
    noBtn.onclick = () => { state.taxiGuestAccepted = false; state.screen = "staffTaxiResult"; render(); };
    grid.appendChild(noBtn);

    screen.appendChild(grid);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← " + t(T.backStep);
    back.onclick = () => { state.screen = "staffTaxiMinutes"; render(); };
    screen.appendChild(back);
    return;
  }

  if (state.screen === "staffTaxiResult") {
    const q = document.createElement("div");
    q.className = "question";
    q.textContent = "スタッフ用：ゲストの回答";
    screen.appendChild(q);

    const box = document.createElement("div");
    box.className = "explain-box";
    box.textContent = state.taxiGuestAccepted
      ? "ゲストが承諾しました。タクシーの手配をお願いします。"
      : "ゲストは辞退されました。手配は不要です。";
    screen.appendChild(box);

    const btn = document.createElement("button");
    btn.className = "primary-btn";
    btn.textContent = "← " + t(T.backHome);
    btn.onclick = () => {
      state.pendingTaxiMinutes = undefined;
      state.taxiGuestAccepted = undefined;
      goHome();
    };
    screen.appendChild(btn);
    return;
  }

  if (state.screen === "staffLuggageIntake") {
    const q = document.createElement("div");
    q.className = "question";
    q.textContent = "スタッフ用：まず送り先のご住所を伺ってください";
    screen.appendChild(q);

    const box = document.createElement("div");
    box.className = "explain-box";
    box.textContent = "送り状はスタッフが作成します。ゲストへ送り先のご住所を確認してから、発送タイミングを選んでください。";
    screen.appendChild(box);

    const grid = document.createElement("div");
    grid.className = "grid";

    const todayBtn = document.createElement("button");
    todayBtn.className = "opt-btn wide";
    todayBtn.innerHTML = `<span class="icon">📦</span>本日発送する`;
    todayBtn.onclick = () => { state.screen = "guestLuggageWait"; render(); };
    grid.appendChild(todayBtn);

    const laterBtn = document.createElement("button");
    laterBtn.className = "opt-btn wide";
    laterBtn.innerHTML = `<span class="icon">🗓️</span>後日発送する`;
    laterBtn.onclick = () => {
      state.screen = "guestAnswer";
      state.answer = { text: luggageLaterText };
      render();
    };
    grid.appendChild(laterBtn);

    screen.appendChild(grid);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← 戻る";
    back.onclick = () => { state.screen = "summary"; render(); };
    screen.appendChild(back);
    return;
  }

  if (state.screen === "guestLuggageWait") {
    const box = document.createElement("div");
    box.className = "explain-box";
    box.textContent = t(luggageWaitText);
    screen.appendChild(box);

    const btn = document.createElement("button");
    btn.className = "primary-btn";
    btn.textContent = t(T.close);
    btn.onclick = () => { state.screen = "staffNumeric"; render(); };
    screen.appendChild(btn);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← " + t(T.backStep);
    back.onclick = () => { state.screen = "staffLuggageIntake"; render(); };
    screen.appendChild(back);
    return;
  }

  if (state.screen === "guestAnswer") {
    // このリクエストが完了した最初の描画時に一度だけ履歴へ記録する（多言語切替の再描画で重複記録しないようguardする）
    if (!state.historyLogged) {
      const cat = currentCategory();
      if (cat) {
        const steps = getSteps(cat);
        const choiceStep = steps.find(s => s.type === "choice" || s.type === "itemQty" || s.type === "multiItem");
        const opt = choiceStep && state.selectedOpt[choiceStep.key];
        const lines = cat.summary(state.answers, opt, cat);
        const answerEn = (state.answer && state.answer.text && state.answer.text.en) || "";
        saveHistoryEntry({
          time: Date.now(),
          catId: cat.id,
          lines,
          room: state.answers.room || "",
          urgent: state.answers.urgent === true || !!cat.emergency,
          answerEn
        });
        // スプレッドシートにも「完了」イベントを送る（開始イベントと同じsessionIdで後から突き合わせて離脱率を出せる）
        const responseSeconds = state.flowStartTime ? Math.round((Date.now() - state.flowStartTime) / 1000) : "";
        sendAnalyticsEvent("complete", {
          sessionId: state.sessionId || "",
          category: cat.id,
          kind: analyticsKind(cat),
          room: state.answers.room || "",
          urgent: state.answers.urgent === true || !!cat.emergency,
          lang: state.lang || "",
          amountYen: state.lastAmountYen != null ? state.lastAmountYen : "",
          responseSeconds,
          unavailableItems: state.lastUnavailableItems || [],
          answerEn
        });
      }
      state.historyLogged = true;
    }

    const box = document.createElement("div");
    box.className = "explain-box";
    box.style.whiteSpace = "pre-line";
    box.textContent = t(state.answer.text);
    screen.appendChild(box);

    const back = document.createElement("button");
    back.className = "primary-btn";
    back.textContent = t(T.backHome);
    back.onclick = goHome;
    screen.appendChild(back);
    return;
  }

  if (state.screen === "history") {
    const list = loadHistory();

    const q = document.createElement("div");
    q.className = "question";
    q.textContent = `スタッフ用：リクエスト履歴（${list.length}件）`;
    screen.appendChild(q);

    if (list.length === 0) {
      const empty = document.createElement("div");
      empty.className = "explain-box";
      empty.textContent = "まだ履歴はありません。";
      screen.appendChild(empty);
    } else {
      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.style.flexDirection = "column";
      wrap.style.gap = "10px";
      wrap.style.marginBottom = "16px";

      list.slice(0, 100).forEach(entry => {
        const row = document.createElement("div");
        row.style.background = "var(--card)";
        row.style.border = "1px solid #eeeae2";
        row.style.borderRadius = "14px";
        row.style.padding = "12px 14px";
        row.style.textAlign = "left";

        const d = new Date(entry.time);
        const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;

        const top = document.createElement("div");
        top.style.display = "flex";
        top.style.justifyContent = "space-between";
        top.style.fontSize = "12px";
        top.style.color = "#888";
        top.innerHTML = `<span>${dateStr}</span><span>${entry.room ? "部屋 " + entry.room : ""}${entry.urgent ? " ・ 🚨至急" : ""}</span>`;
        row.appendChild(top);

        const title = document.createElement("div");
        title.style.fontWeight = "bold";
        title.style.fontSize = "15px";
        title.style.margin = "4px 0 2px";
        title.textContent = (entry.lines && entry.lines[0]) || "";
        row.appendChild(title);

        if (entry.lines && entry.lines.length > 1) {
          const sub = document.createElement("div");
          sub.style.fontSize = "13px";
          sub.style.color = "#555";
          sub.textContent = entry.lines.slice(1).join(" / ");
          row.appendChild(sub);
        }

        if (entry.answerEn) {
          const ans = document.createElement("div");
          ans.style.fontSize = "12px";
          ans.style.color = "var(--main)";
          ans.style.marginTop = "6px";
          ans.textContent = "回答: " + entry.answerEn;
          row.appendChild(ans);
        }

        wrap.appendChild(row);
      });
      screen.appendChild(wrap);

      if (list.length > 100) {
        const note = document.createElement("div");
        note.style.textAlign = "center";
        note.style.fontSize = "12px";
        note.style.color = "#888";
        note.style.marginBottom = "16px";
        note.textContent = `最新100件を表示中（保存件数 ${list.length}件）`;
        screen.appendChild(note);
      }
    }

    const exportBtn = document.createElement("button");
    exportBtn.className = "secondary-btn";
    exportBtn.textContent = "CSVで書き出す";
    exportBtn.disabled = list.length === 0;
    exportBtn.onclick = () => exportHistoryCsv(list);
    screen.appendChild(exportBtn);

    const clearBtn = document.createElement("button");
    clearBtn.className = "secondary-btn";
    clearBtn.style.color = "var(--danger)";
    clearBtn.style.borderColor = "var(--danger)";
    clearBtn.disabled = list.length === 0;
    clearBtn.textContent = "履歴を消去";
    clearBtn.onclick = () => {
      if (confirm("履歴をすべて消去します。よろしいですか？")) {
        clearHistory();
        render();
      }
    };
    screen.appendChild(clearBtn);

    const back = document.createElement("button");
    back.className = "back-btn";
    back.textContent = "← 戻る";
    back.onclick = goHome;
    screen.appendChild(back);
    return;
  }
}

render();
</script>

</body>
</html>
